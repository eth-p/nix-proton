name: Proton Update

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Update"
    uses: eth-p/gh-actions/.github/workflows/run-package-update-scripts.yaml@v1
    with:
      script-branch: ${{ github.event.repository.default_branch }}
      base-branch: ${{ github.event.repository.default_branch }}
      pr-branch: update
      pr-title: "[Update] Update Proton Versions"
      pr-body: "See commits for changes."
      pr-labels: ci
      requires-nix: true
      scripts: |-
        proton-cachyos-bin
        proton-ge-custom-bin
      script-exec: |-
        export UPDATE_PACKAGE_DIR="pkgs/${SCRIPT}"
        nix develop --command \
          "${SCRIPTS_WORKSPACE}/pkgs/${SCRIPT}/update.py" \
          --commit
